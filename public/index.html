<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مستوياتي</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#16384b;font-family:Arial,sans-serif}header{background:#063b55;color:#fff;text-align:center;padding:32px 15px}header h1{margin:0;font-size:32px}header p{font-size:18px}.wrap{max-width:570px;margin:28px auto;padding:0 15px}.card{background:#fff;border-radius:20px;padding:26px;box-shadow:0 8px 30px #0001}input{width:100%;padding:15px;margin:7px 0 14px;border:1px solid #ddd;border-radius:11px;font-size:16px}button{border:0;border-radius:11px;padding:14px 20px;background:#063b55;color:#fff;font-size:16px;cursor:pointer}.tabs{display:flex;gap:10px;margin-bottom:22px}.tabs button{flex:1}.gold{background:#c98945}.hidden{display:none}.error{color:#b42318}.ok{color:#14804a;font-weight:bold}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f4f7f8;padding:18px;border-radius:13px;text-align:center}.big{font-size:30px;font-weight:bold}.progress{height:18px;background:#e7ecef;border-radius:20px;overflow:hidden}.bar{height:100%;background:#c98945;width:0;transition:.3s}.link{padding:14px;background:#f5f5f5;border-radius:10px;word-break:break-all;margin:10px 0}.small{font-size:13px;color:#687780}</style></head>
<body><header><h1>مستوياتي</h1><p>3 إحالات للانتقال إلى المستوى التالي</p></header><div class="wrap">
<section class="card" id="auth"><div class="tabs"><button onclick="tab('login')">تسجيل الدخول</button><button class="gold" onclick="tab('register')">إنشاء حساب</button></div>
<div id="login"><h2>تسجيل الدخول</h2><input id="le" type="email" placeholder="البريد الإلكتروني"><input id="lp" type="password" placeholder="كلمة السر"><button onclick="login()">دخول</button><p id="lm"></p></div>
<div id="register" class="hidden"><h2>إنشاء حساب جديد</h2><input id="rn" placeholder="الاسم"><input id="re" type="email" placeholder="البريد الإلكتروني"><input id="rp" type="password" placeholder="كلمة السر — 6 أحرف على الأقل"><button onclick="register()">إنشاء الحساب</button><p id="rm"></p></div></section>
<section class="card hidden" id="dash"><div style="display:flex;justify-content:space-between;align-items:center"><h2>لوحة التحكم</h2><button onclick="logout()">خروج</button></div><p>مرحبًا، <b id="un"></b></p>
<div class="stats"><div class="stat"><div class="small">المستوى</div><div class="big" id="ul">1</div></div><div class="stat"><div class="small">الإحالات</div><div class="big" id="ur">0/3</div></div></div>
<h3>التقدم</h3><div class="progress"><div class="bar" id="bar"></div></div><p id="st"></p><h3>رابط الإحالة</h3><div class="link" id="rl"></div><button onclick="copyLink()">نسخ الرابط</button></section></div>
<script>
const $=x=>document.getElementById(x);
function tab(x){$("login").classList.toggle("hidden",x!=="login");$("register").classList.toggle("hidden",x!=="register")}
async function api(url,o={}){o.headers={"Content-Type":"application/json",...(o.headers||{})};if(localStorage.token)o.headers.Authorization="Bearer "+localStorage.token;const r=await fetch(url,o);const d=await r.json();if(!r.ok)throw Error(d.error||"حدث خطأ");return d}
async function register(){try{const ref=new URLSearchParams(location.search).get("ref");const d=await api("/api/register",{method:"POST",body:JSON.stringify({name:$("rn").value,email:$("re").value,password:$("rp").value,ref})});localStorage.token=d.token;render(d.user)}catch(e){$("rm").textContent=e.message;$("rm").className="error"}}
async function login(){try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email:$("le").value,password:$("lp").value})});localStorage.token=d.token;render(d.user)}catch(e){$("lm").textContent=e.message;$("lm").className="error"}}
async function load(){if(!localStorage.token)return;try{render((await api("/api/me")).user)}catch(e){localStorage.removeItem("token")}}
function render(u){$("auth").classList.add("hidden");$("dash").classList.remove("hidden");$("un").textContent=u.name;$("ul").textContent=u.level;$("ur").textContent=u.referrals+"/3";$("bar").style.width=(u.referrals/3*100)+"%";$("st").innerHTML=u.referrals?u.referrals<3?"باقي "+(3-u.referrals)+" إحالة للانتقال للمستوى التالي.":"<span class=ok>🎉 انتقلتِ إلى المستوى التالي!</span>":"ابدئي بدعوة 3 أشخاص.";$("rl").textContent=location.origin+location.pathname+"?ref="+u.referral_code}
function logout(){localStorage.removeItem("token");location.reload()}function copyLink(){navigator.clipboard.writeText($("rl").textContent);alert("تم نسخ الرابط")}load();
</script></body></html>
