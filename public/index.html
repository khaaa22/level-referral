<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام لوحات الإحالات والمستويات</title>
  <style>
    :root {
      --primary: #f59e0b;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { color: var(--primary); font-size: 1.4rem; text-align: center; margin-bottom: 24px; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #0f172a;
      color: var(--text);
      cursor: pointer;
      font-weight: bold;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #000;
    }
    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 1rem;
    }
    button.submit-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 6px;
    }
    .msg {
      margin-top: 14px;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.4;
    }
    .msg.error { color: #f87171; }
    .msg.success { color: #4ade80; }
    .otp-box {
      background: #0f172a;
      border: 1px dashed var(--primary);
      color: var(--primary);
      font-size: 1.3rem;
      font-weight: bold;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>

  <h1>نظام لوحات الإحالات والمستويات</h1>

  <div class="card" id="authBox">
    <div class="tabs">
      <button class="tab-btn active" id="tabReg" onclick="switchTab('register')">إنشاء حساب</button>
      <button class="tab-btn" id="tabLogin" onclick="switchTab('login')">تسجيل الدخول</button>
    </div>

    <!-- نموذج إنشاء حساب -->
    <div id="registerForm">
      <input type="text" id="regName" placeholder="اسمك الكامل">
      <input type="email" id="regEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="regPass" placeholder="كلمة المرور">
      <input type="text" id="regRef" placeholder="رمز الإحالة (اختياري)">
      <button class="submit-btn" onclick="handleRegister()">إنشاء الحساب وإرسال الرمز</button>
    </div>

    <!-- نموذج كود التحقق OTP -->
    <div id="otpForm" style="display: none;">
      <p style="font-size: 0.9rem; text-align: center; color: #cbd5e1;">أدخل رمز التحقق الذي ظهر لك:</p>
      <div id="otpDisplay" class="otp-box"></div>
      <br>
      <input type="text" id="otpInput" placeholder="أدخل كود الـ OTP المكون من 6 أرقام">
      <button class="submit-btn" onclick="handleVerify()">تفعيل الحساب والدخول</button>
    </div>

    <!-- نموذج تسجيل الدخول -->
    <div id="loginForm" style="display: none;">
      <input type="email" id="logEmail" placeholder="البريد الإلكتروني">
      <input type="password" id="logPass" placeholder="كلمة المرور">
      <button class="submit-btn" onclick="handleLogin()">تسجيل الدخول</button>
    </div>

    <div id="statusMsg" class="msg"></div>
  </div>

  <!-- لوحة التحكم بعد الدخول -->
  <div class="card" id="dashBox" style="display: none; max-width: 600px;">
    <h2 id="welcomeUser" style="color: var(--primary); margin-top:0;"></h2>
    <p>المستوى الحالي: <strong id="userLevel" style="color:#38bdf8;"></strong></p>
    <p>كود الإحالة الخاص بك: <code id="userRef" style="background:#0f172a; padding:4px 8px; border-radius:4px; color:var(--primary);"></code></p>
    <p>عدد الإحالات الناجحة: <span id="refCount">0</span></p>
    <hr style="border-color: var(--border); margin: 20px 0;">
    <button class="submit-btn" style="background: #ef4444; color: #fff;" onclick="logout()">تسجيل الخروج</button>
  </div>

  <script>
    let currentEmail = "";

    function switchTab(type) {
      document.getElementById('statusMsg').innerText = '';
      if (type === 'register') {
        document.getElementById('tabReg').classList.add('active');
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('registerForm').style.display = 'block';
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('otpForm').style.display = 'none';
      } else {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabReg').classList.remove('active');
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('otpForm').style.display = 'none';
      }
    }

    async function handleRegister() {
      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPass').value;
      const ref = document.getElementById('regRef').value.trim();
      const msg = document.getElementById('statusMsg');

      if (!name || !email || !password) {
        msg.className = "msg error";
        msg.innerText = "يرجى ملء جميع الحقول المطلوبة";
        return;
      }

      msg.className = "msg";
      msg.innerText = "جاري إنشاء الحساب...";

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password, referral_code: ref })
        });
        const data = await res.json();

        if (res.ok) {
          currentEmail = email;
          document.getElementById('registerForm').style.display = 'none';
          document.getElementById('otpForm').style.display = 'block';
          document.getElementById('otpDisplay').innerText = data.otp || "تم إصدار الرمز";
          if (data.otp) {
            document.getElementById('otpInput').value = data.otp;
          }
          msg.className = "msg success";
          msg.innerText = "تم إنشاء الحساب بنجاح! انسخ الكود أعلاه واضغط تفعيل.";
        } else {
          msg.className = "msg error";
          msg.innerText = data.error || "تعذر التسجيل";
        }
      } catch (err) {
        msg.className = "msg error";
        msg.innerText = "خطأ في الاتصال بالخادم";
      }
    }

    async function handleVerify() {
      const otp = document.getElementById('otpInput').value.trim();
      const msg = document.getElementById('statusMsg');

      if (!otp) {
        msg.className = "msg error";
        msg.innerText = "يرجى إدخال الرمز";
        return;
      }

      try {
        const res = await fetch("/api/verify-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email: currentEmail, otp })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          loadDashboard();
        } else {
          msg.className = "msg error";
          msg.innerText = data.error || "الرمز غير صحيح";
        }
      } catch (err) {
        msg.className = "msg error";
        msg.innerText = "فشل الاتصال";
      }
    }

    async function handleLogin() {
      const email = document.getElementById('logEmail').value.trim();
      const password = document.getElementById('logPass').value;
      const msg = document.getElementById('statusMsg');

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem("token", data.token);
          loadDashboard();
        } else {
          msg.className = "msg error";
          msg.innerText = data.error || "خطأ في تسجيل الدخول";
        }
      } catch (err) {
        msg.className = "msg error";
        msg.innerText = "خطأ في الاتصال";
      }
    }

    async function loadDashboard() {
      const token = localStorage.getItem("token");
      if (!token) return;

      try {
        const res = await fetch("/api/dashboard", {
          headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();

        if (res.ok) {
          document.getElementById('authBox').style.display = 'none';
          document.getElementById('dashBox').style.display = 'block';
          document.getElementById('welcomeUser').innerText = "مرحباً، " + data.user.name;
          document.getElementById('userLevel').innerText = "المستوى " + data.user.level;
          document.getElementById('userRef').innerText = data.user.referral_code;
          document.getElementById('refCount').innerText = data.referralCount;
        } else {
          logout();
        }
      } catch {
        logout();
      }
    }

    function logout() {
      localStorage.removeItem("token");
      location.reload();
    }

    // تحقق من تسجيل الدخول عند الفتح
    if (localStorage.getItem("token")) {
      loadDashboard();
    }
  </script>
</body>
</html>
