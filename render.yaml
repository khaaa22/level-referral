services:
  - type: web
    name: level-referral-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: level-referral-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: level-referral-db
    plan: free
